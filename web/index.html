<!doctype html>
<html lang="zh-CN" class="dark font-sans" data-theme="dark" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="hfp-tv · AI 影视与短剧创作工作台" />
        <link rel="icon" href="/hfp-logo.svg" type="image/svg+xml" />
        <title>hfp-tv</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--stage, #0b0b0d);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: #0b0b0d;
            }
            #root:empty::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: 44px;
                height: 44px;
                transform: translate(-50%, -50%);
                background: linear-gradient(105deg, #c9c9c9 0%, #f4f4f6 45%, #ff6a2c 52%, #f4f4f6 60%, #c9c9c9 100%);
                background-size: 240% 100%;
                background-position: 100% 0;
                -webkit-mask: url('/hfp-logo.svg') center / contain no-repeat;
                mask: url('/hfp-logo.svg') center / contain no-repeat;
                animation: appearance-bootstrap-shimmer 2.2s ease-in-out infinite;
            }
            @keyframes appearance-bootstrap-shimmer {
                0%, 12% { background-position: 100% 0; }
                82%, 100% { background-position: 0 0; }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: none;
                    background: #f4f4f6;
                }
            }
        </style>
        <script>
            let theme = "dark";
            try {
                if (JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state?.theme === "light") theme = "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#0b0b0d" : "#ebebee");
            document.documentElement.style.setProperty("--stage", theme === "dark" ? "#0b0b0d" : "#ebebee");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
