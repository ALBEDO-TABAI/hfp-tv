<!doctype html>
<html lang="zh-CN" class="dark font-sans" data-theme="dark" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="hfp - all in one · AI 影视与短剧创作工作台" />
        <link rel="icon" href="/app-icon.png" type="image/png" />
        <title>hfp - all in one</title>
        <style>
            html,
            body {
                margin: 0;
                background: var(--stage, #0b0b0d);
            }
            #root:empty {
                position: fixed;
                inset: 0;
                min-height: 100vh;
                overflow: hidden;
                background: #0b0b0d;
            }
            #root:empty::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: 44px;
                height: 44px;
                transform: translate(-50%, -50%);
                background: url('/app-icon.png') center / contain no-repeat;
            }
        </style>
        <script>
            let theme = "dark";
            try {
                if (JSON.parse(localStorage.getItem("infinite-canvas:theme_store"))?.state?.theme === "light") theme = "light";
            } catch {}
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
            document.documentElement.style.setProperty("--background", theme === "dark" ? "#0b0b0d" : "#ebebee");
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
