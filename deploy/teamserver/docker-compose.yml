# 团队服务器：一个进程服务多名成员，每人一个独立工作区内核。
# 默认按内网 HTTP 部署，对外只占一个端口（TEAMSERVER_HTTP_PORT，默认 80）。
# 有域名、要 HTTPS 时见 docker-compose.https.yml。用法见 docs/deployment.md。
services:
  teamserver:
    image: hfp-teamserver:local
    build:
      context: ../..
      dockerfile: deploy/teamserver/Dockerfile
      args:
        # Go 依赖源：默认先走国内镜像，出错再换官方源；公司有自己的 Go 代理时在 .env 里设置 GOPROXY。
        GOPROXY: ${GOPROXY:-https://goproxy.cn|https://proxy.golang.org,direct}
        # update.sh 填入当前提交和构建时间，排查信息和任务诊断据此显示实际运行的版本。
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    # .env 里的设置原样传进容器（TEAMSERVER_*、CANVAS_* 等）；下面 environment 写死的几项优先。
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内监听地址和数据目录固定，Caddy 和数据卷依赖它们；对外端口改 TEAMSERVER_HTTP_PORT。
      TEAMSERVER_ADDR: ":8080"
      TEAMSERVER_DATA_DIR: /data
      # 只信任 Compose 网络里的 Caddy 传来的 X-Forwarded-For / X-Forwarded-Proto。
      TEAMSERVER_TRUSTED_PROXIES: ${TEAMSERVER_TRUSTED_PROXIES:-172.16.0.0/12}
      # 团队服务器强制关闭私网出站；公司中转站地址自动放行，其他内网地址写进 CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS。
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - teamserver-data:/data
      - ./config:/config:ro
    restart: unless-stopped
    stop_grace_period: 3m

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - teamserver
    ports:
      - "${TEAMSERVER_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  teamserver-data:
  caddy-data:
  caddy-config:
